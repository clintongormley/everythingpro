# Model-agnostic firmware core, shared by everything-presence-pro-base.yaml and
# everything-presence-lite-base.yaml.
#
# Everything here is identical on both boards: the zone-engine API surface, the
# logging model, OTA, and the diagnostic entities. Anything that touches
# model-specific hardware (LEDs, relay, PIR, SHTC3, DFRobot, I2C/UART pins)
# stays in the per-model base. ESPHome deep-merges packages, so each base adds
# its own keys to the `esphome:`, `epp:`, `api:`, and `sensor:` blocks defined
# here rather than restating them.
#
# `project.version` lives here so the two models can never report different
# firmware versions; `project.name` is set per model.

# Which repository this firmware belongs to. Every variant builds its
# `dashboard_import.package_import_url` and its `update:` manifest URL from
# these, so a fork's firmware points at the fork's own releases rather than
# fetching updates from upstream.
#
# The defaults are upstream. CI overrides them from the repository it is
# actually running in (see firmware.yml / firmware-release.yml), so a fork needs
# no edit here at all — its Actions builds target its own GitHub Pages
# automatically.
#
# NOTE for anyone overriding by hand: `-s` is a *global* esphome option and must
# come before the subcommand. `esphome compile x.yaml -s key value` is silently
# ignored; `esphome -s key value compile x.yaml` is what works.
substitutions:
  epp_repo_owner: "clintongormley"
  epp_repo_name: "everything-presence-pro-grid"

esphome:
  # Floor for DIY adopters who build from package_import_url with their own
  # ESPHome — the CI pin (firmware/requirements.txt) can't reach them. Set to
  # the build pin as policy: we declare the version we actually validate against,
  # not the lowest that merely compiles. The state_class fix itself needs no
  # floor (it's set explicitly below), so this is deliberately conservative.
  # Kept consistent with the pin (min_version <= pin) by
  # tests/test_firmware_esphome_pin.py.
  min_version: "2026.5.3"
  project:
    version: "1.9.0"
  on_boot:
    - priority: 200
      then:
        - lambda: |-
            auto &logger = *id(logger_id);
            logger.set_log_level(ESPHOME_LOG_LEVEL_NONE);
            // `system` is the global default level (set_log_level with no
            // tag), which ESPHome uses as the fallback for any tag WITHOUT
            // an explicit override. Pin every category tag to NONE here so
            // raising `system` to Debug only surfaces genuinely
            // uncategorised tags (api, ota, uart, light, switch, ...) and
            // never leaks epp/sensor/led/networking/ble/co2 logs the user
            // didn't enable. Keep this list in sync with the
            // epp_set_log_level category mapping below (enforced by
            // tests/test_firmware_log_category_mapping.py).
            for (const char *tag : {
                   "epp", "sensor", "text_sensor", "binary_sensor",
                   "control_leds",
                   "wifi", "esp_netif", "dhcp", "eth", "esp_eth", "phy",
                   "bt", "btm", "bta", "hci", "gap", "controller",
                   "esp32_ble_tracker", "bluetooth_proxy",
                   "scd4x"}) {
              logger.set_log_level(tag, ESPHOME_LOG_LEVEL_NONE);
            }

external_components:
  - source:
      type: local
      path: ../components
    components: [epp]

# Enable logging
logger:
  id: logger_id
  runtime_tag_levels: true

globals:
  - id: env_illuminance_offset
    type: float
    initial_value: '0'
  - id: current_connection_count
    type: int
    initial_value: '0'

# Enable Home Assistant API
api:
  id: api_id
  actions:
    - action: set_update_manifest
      variables:
        url: string
      then:
        - lambda: |-
            ESP_LOGI("fw", "Setting update manifest URL: %s", url.c_str());
            id(update_http_request).set_source_url(url);
        - component.update: update_http_request
        # component.update fetches + parses the manifest in a background task on
        # ESP32, so update_info.firmware_url stays empty until that lands. Wait
        # for it rather than racing a fixed delay: under load (several devices
        # flashing at once) the fetch can outlast any fixed wait, and forcing
        # perform then starts the OTA with an empty URL ("URL not set; cannot
        # start update"). Bounded by a timeout so a failed fetch can't hang.
        - wait_until:
            condition:
              lambda: 'return !id(update_http_request).update_info.firmware_url.empty();'
            timeout: 30s
        - if:
            condition:
              lambda: 'return !id(update_http_request).update_info.firmware_url.empty();'
            then:
              - update.perform:
                  id: update_http_request
                  force_update: true
            else:
              - lambda: 'ESP_LOGE("fw", "OTA manifest did not load in time; not starting update");'
    - action: epp_set_perspective
      variables:
        perspective: string
        room_width: float
        room_depth: float
      then:
        - lambda: |-
            id(epp_component).set_perspective(perspective, room_width, room_depth);
    - action: epp_set_grid
      variables:
        grid_data: string
        origin_x: float
        origin_y: float
      then:
        - lambda: |-
            id(epp_component).set_grid(grid_data, origin_x, origin_y);
    - action: epp_set_zones
      variables:
        zones_json: string
      then:
        - lambda: |-
            id(epp_component).set_zones(zones_json);
    - action: epp_dismiss_target
      variables:
        target_index: int
        cell_index: int
      then:
        - lambda: |-
            id(epp_component).dismiss_target(target_index, cell_index);
    - action: epp_set_stuck_target_timeout
      variables:
        timeout: float
      then:
        - lambda: |-
            ESP_LOGI("epp", "epp_set_stuck_target_timeout: timeout=%.1fs", timeout);
            id(epp_component).set_stuck_target_timeout(timeout);
    - action: epp_set_tracking
      variables:
        max_range: float
      then:
        - lambda: |-
            ESP_LOGI("epp", "epp_set_tracking: max_range=%.0f", max_range);
            id(tracking_max_range) = max_range;
    - action: epp_set_pipeline
      variables:
        entity_target_interval: int
        entity_zone_interval: int
        display_interval: int
        zone_state_interval: int
        heatmap_interval: int
      then:
        - lambda: |-
            id(epp_component).set_entity_target_interval(entity_target_interval);
            id(epp_component).set_entity_zone_interval(entity_zone_interval);
            id(epp_component).set_display_interval(display_interval);
            id(epp_component).set_zone_state_interval(zone_state_interval);
            id(epp_component).set_heatmap_interval(heatmap_interval);
    - action: epp_set_log_level
      variables:
        category: string
        level: string
      then:
        - lambda: |-
            int log_level;
            if (level == "None") log_level = ESPHOME_LOG_LEVEL_NONE;
            else if (level == "Error") log_level = ESPHOME_LOG_LEVEL_ERROR;
            else if (level == "Warning") log_level = ESPHOME_LOG_LEVEL_WARN;
            else if (level == "Info") log_level = ESPHOME_LOG_LEVEL_INFO;
            else log_level = ESPHOME_LOG_LEVEL_DEBUG;

            auto &logger = *id(logger_id);
            if (category == "system") {
              logger.set_log_level(log_level);
            } else if (category == "epp") {
              logger.set_log_level("epp", log_level);
              // Zone/target/motion entity states ('Zone N Target Count',
              // 'Target N Position', 'Motion Presence') are emitted under
              // ESPHome's shared framework tags, not the `epp` tag. Group
              // them with the zone engine so they appear here and NOT under
              // `system`.
              logger.set_log_level("sensor", log_level);
              logger.set_log_level("text_sensor", log_level);
              logger.set_log_level("binary_sensor", log_level);
            } else if (category == "led") {
              logger.set_log_level("control_leds", log_level);
            } else if (category == "networking") {
              logger.set_log_level("wifi", log_level);
              logger.set_log_level("esp_netif", log_level);
              logger.set_log_level("dhcp", log_level);
              logger.set_log_level("eth", log_level);
              logger.set_log_level("esp_eth", log_level);
              logger.set_log_level("phy", log_level);
            } else if (category == "ble") {
              // ESP-IDF BLE controller layers
              logger.set_log_level("bt", log_level);
              logger.set_log_level("btm", log_level);
              logger.set_log_level("bta", log_level);
              logger.set_log_level("hci", log_level);
              logger.set_log_level("gap", log_level);
              logger.set_log_level("controller", log_level);
              // ESPHome layers — without these the user sees nothing useful
              // from the panel's "BLE → Debug" toggle (no scan results, no
              // proxy connection events, etc).
              logger.set_log_level("esp32_ble_tracker", log_level);
              logger.set_log_level("bluetooth_proxy", log_level);
            } else if (category == "co2") {
              logger.set_log_level("scd4x", log_level);
            }
    - action: get_build_flags
      then:
        - api.respond:
            data: !lambda |-
              root["ethernet_enabled"]  = ${ device_config.ethernet_enabled | lower };
              root["co2_enabled"]       = ${ device_config.co2_enabled | lower };
              root["bluetooth_enabled"] = ${ device_config.bluetooth_enabled | lower };
              root["board_revision"]    = "${ device_config.board_revision }";
              root["sensor_variant"]    = "${ device_config.sensor_variant }";
              root["firmware_channel"]  = "${ device_config.firmware_channel }";
              root["model"]             = "${ device_config.model }";
              root["heatmap"]           = EPP_HEATMAP_ENABLED != 0;
              // Hardware capability flags. The panel hides the controls for
              // anything a board does not have, so these describe the PCB and
              // must match what the model's base actually wires up — a flag
              // that overstates the hardware leaves the user a control whose
              // service the firmware never declared, which pushes silently
              // nowhere. Defined per model in {lite-,}variant-defaults.yaml.
              root["has_temperature"]      = ${ device_config.has_temperature | lower };
              root["has_humidity"]         = ${ device_config.has_humidity | lower };
              root["has_illuminance"]      = ${ device_config.has_illuminance | lower };
              root["has_motion_presence"]  = ${ device_config.has_motion_presence | lower };
              root["has_static_presence"]  = ${ device_config.has_static_presence | lower };
              root["has_led"]              = ${ device_config.has_led | lower };
              root["has_relay"]            = ${ device_config.has_relay | lower };
              root["has_target_presence"]  = ${ device_config.has_target_presence | lower };
              root["has_mmwave_presence"]  = ${ device_config.has_mmwave_presence | lower };
              root["has_assisted_clear"]   = ${ device_config.has_assisted_clear | lower };
    - action: epp_clear_heatmap
      then:
        - lambda: 'id(epp_component).clear_heatmap();'
        - api.respond:
            data: !lambda |-
              root["cleared"] = true;
    - action: epp_get_heatmap
      then:
        - api.respond:
            data: !lambda |-
              root["b64"] = id(epp_component).get_heatmap_base64();

  on_client_connected:
    then:
      - lambda: |-
          id(current_connection_count) += 1;
          id(current_connection_count_sensor).publish_state(id(current_connection_count));

  on_client_disconnected:
    then:
      - lambda: |-
          id(current_connection_count) -= 1;
          if (id(current_connection_count) < 0) id(current_connection_count) = 0;
          id(current_connection_count_sensor).publish_state(id(current_connection_count));

http_request:
  verify_ssl: false

ota:
  - platform: esphome
  - platform: http_request
    id: ota_http_request
    # OTA hooks that pause BLE scan for the duration of the download live in
    # `bluetooth-base.yaml` (extending this id) so the dependency on
    # esp32_ble_tracker is colocated with the component that defines it.

debug:
  update_interval: 60s

sensor:
  - platform: debug
    # state_class is set explicitly: ESPHome's debug platform only began
    # defaulting state_class on these heap sensors in 2026.4.0 (PR #15486).
    # Builds compiled with an older ESPHome ship them with no state_class, so
    # HA silently drops long-term statistics ("no longer has a state class").
    free:
      name: "Heap Free"
      id: heap_free
      entity_category: diagnostic
      state_class: measurement
    block:
      name: "Heap Largest Block"
      id: heap_largest_block
      entity_category: diagnostic
      state_class: measurement
    loop_time:
      name: "Loop Time"
      id: loop_time
      entity_category: diagnostic
      state_class: measurement

  - platform: template
    name: "Heap Min Free"
    id: heap_min_free
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    lambda: |-
      return (float) heap_caps_get_minimum_free_size(MALLOC_CAP_DEFAULT);

  - platform: template
    name: "Current Connections"
    id: current_connection_count_sensor
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      id: reset_reason
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart Device"
    entity_category: config

